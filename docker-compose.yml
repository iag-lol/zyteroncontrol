services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zyteron_control
      POSTGRES_USER: zyteron
      POSTGRES_PASSWORD: zyteron
    ports:
      - "5432:5432"
    volumes:
      - zyteron_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyteron -d zyteron_control"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zyteron_postgres:

